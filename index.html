<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>校园失物招领 · 后台管理</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- 登录页 -->
  <div id="login" class="login">
    <div class="login-card">
      <div class="login-logo">校园失物招领后台</div>
      <p class="login-sub">Campus Lost &amp; Found · Admin</p>
      <input id="acc" class="login-input" placeholder="账号" value="admin" />
      <input id="pwd" class="login-input" type="password" placeholder="密码" value="123456" />
      <button id="loginBtn" class="login-btn">登录</button>
      <p class="login-tip">演示模式：默认使用内置 Mock 数据，任意账号可登录</p>
    </div>
  </div>

  <!-- 管理外壳 -->
  <div id="shell" class="shell hidden">
    <aside class="sidebar">
      <div class="side-logo">失物招领</div>
      <nav class="side-nav">
        <div class="nav-item" data-key="overview">数据概览</div>
        <div class="nav-item" data-key="items">信息审核</div>
        <div class="nav-item" data-key="users">用户管理</div>
        <div class="nav-item" data-key="reports">举报处理</div>
        <div class="nav-item" data-key="places">地点管理</div>
      </nav>
      <div class="side-foot">管理员 · 在线</div>
    </aside>

    <main class="main">
      <header class="topbar"><span id="pageTitle">数据概览</span></header>
      <section id="content" class="content"></section>
    </main>
  </div>

  <div id="modal" class="modal hidden"><div class="modal-box" id="modalBox"></div></div>

  <script src="https://imgcache.qq.com/qcloud/tcbjs/1.9.2/tcb.js"></script>
  <script src="js/config.js"></script>
  <script src="js/mock.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
